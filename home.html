<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-th assignment</title>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">
    <!-- daisy+tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- font style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

</head>

<style>
    * {
        font-family: "Geist", sans-serif;
    }
</style>

<body class="container mx-auto">
    <!-- navbar  -->
    <div class="navbar bg-base-100 shadow-sm justify-between">
        <div class="flex items-center gap-2 md:ml-[80px]">
            <img class="h-9 w-9" src="assets/github-logo.png" alt="">
            <a class=" font-semibold text-xl">GitHub Issues Tracker</a>
        </div>
        <div class="flex gap-2 md:mr-[80px] flex-col md:flex-row">
            <label class="input">
                <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                        stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </g>
                </svg>
                <input id="input-Search" type="search" required placeholder="Search issues..." />
            </label>
            <button class="btn btn-primary" id="btn-Search"><span><i class="fa-solid fa-magnifying-glass"></i></span>Search</button>
        </div>
    </div>

    <!-- btn-section -->
    <section class=" md:w-7/10 mx-auto w-full ">
        <div class="bg-base-100 shadow-sm justify-between mt-[60px] space-x-1 p-3 ">
            <button onclick="BTNclick(this)" id="btn-all"  class="btn btn-w btn-primary btn-soft w-[70px]">all</button>
            <button onclick="BTNclick(this)" id="btn-open" class="btn btn-w btn-primary btn-soft w-[80px]">open</button>
            <button onclick="BTNclick(this)" id="btn-close" class="btn btn-w btn-primary btn-soft w-[80px]">close</button>
        </div>
    </section>

    <!-- card head section -->
    <section class=" md:w-7/10 mx-auto sm:w-full">
        <div class="bg-base-100 shadow-sm flex flex-col md:flex-row justify-between mt-[17px] space-x-1 p-3">
            <div class="flex items-center space-x-3 ">
                <div class="rounded-full bg-[#ECE4FF] p-2">
                <img class="h-9 w-9 " src="assets/Aperture.png" alt="">
                </div>
                <div>
                    <a id="issue-count" class="font-semibold text-xl">0 Issues</a>
                    <p class="text-[#64748B]">Track and manage your project issues</p>  
                </div>
            </div>
                <div class="flex flex-row  md:justify-center justify-end items-center space-x-2">
                    <p class="rounded-full bg-green-700 p-2 w-4 h-4"></p><span>Open</span>
                    <p class="rounded-full bg-purple-800 p-2 w-4 h-4 "></p><span>Close</span>
                </div>
        </div>
    </section>

    <!-- card section -->
     <section id="all-card-section" class=" grid grid-cols-4 md:w-7/10 mx-auto gap-3 p-4"></section>


    <!-- card modal-->


    <!-- Open the modal using ID.showModal() method -->
<dialog id="issue_modal" class="modal">
  <div class="modal-box w-9/12 max-w-3xl">
    <div id="modal-card"></div> <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
      </form>
    </div>
  </div>
</dialog>
<script src="index.js"></script>
</body>

</html>
